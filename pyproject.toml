[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volleymetrics-mcp"
version = "0.1.0"
description = "Production-grade Model Context Protocol (MCP) server for Volleymetrics volleyball analytics"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Onno Bos" }
]
urls = { "Homepage" = "https://github.com/onnobos/volleymetrics_mcp", "Repository" = "https://github.com/onnobos/volleymetrics_mcp", "Issues" = "https://github.com/onnobos/volleymetrics_mcp/issues" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp>=1.3.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0",
    "diskcache>=5.6.3",
    "platformdirs>=4.0.0",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hatchling>=1.20.0",
]

[project.scripts]
volleymetrics-mcp = "volleymetrics_mcp.server:main"
mcp-volleymetrics = "volleymetrics_mcp.server:main"
volleymetrics-auth-refresh = "volleymetrics_mcp.auth_refresh:main"
volleymetrics-test = "volleymetrics_mcp.test_connection:main"

[tool.hatch.build.targets.wheel]
packages = ["src/volleymetrics_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
